  const pii = V.find(v => v.rule_id === "ETL-DQ-034");
  return head(1, "總覽", "這次整併把 CampusGo（併購方）與 CallFood（被併購方）的顧客、訂單、客訴合成一份資料集，並跑完 40 條驗證規則。") +
  `<div class="gate ${open ? "open" : ""}">${open ? `<h3>40 條規則沒有未通過，整併資料已正式發布到 merged_output/</h3>` :
    `<h3>發布閘門 CLOSED：${blockers.length} 條規則未通過，資料留在候選資料集（${esc(R.source_dir)}/），不得當正式資料使用</h3>
     <p class="note" style="color:var(--ink)">依 RULE.md 第 7 條，任何一條規則未通過就不發布；ETL-DQ-032 是閘門本身，因此也記為未通過。處理方式見 §7 風險與改善。</p>`}</div>
  <div class="grid3">
    <div class="card kpi"><div class="label">訂單（整併後）</div><div class="value">${fmt(A.orders)}</div><div class="split"><span><i class="dot cg"></i>${fmt(cg.o)}</span><span><i class="dot cf"></i>${fmt(cf.o)}</span><span>隔離 ${fmt(A.rejected_orders)}</span></div></div>
    <div class="card kpi"><div class="label">GMV（商品金額）</div><div class="value">${short(cg.g + cf.g)}</div><div class="split"><span><i class="dot cg"></i>${short(cg.g)}</span><span><i class="dot cf"></i>${short(cf.g)}</span></div></div>
    <div class="card kpi"><div class="label">不重複顧客</div><div class="value">${fmt(A.customers)}</div><div class="split"><span>來源 ${fmt(A.xref)} 筆，合併重疊 ${fmt(A.overlap)} 人</span></div></div>
    <div class="card kpi"><div class="label">客訴（CampusGo）</div><div class="value">${fmt(A.complaints)}</div><div class="split"><span>來源 ${fmt(B.cp.rows)}，隔離 ${fmt(A.rejected_complaints)}</span></div></div>
    <div class="card kpi"><div class="label">40 條規則</div><div class="value">${vc("PASS")} 通過</div><div class="split"><span class="pill WARN">${vc("WARN")} 警示</span><span class="pill FAIL">${vc("FAIL")} 未通過</span><span class="pill NA">${vc("N/A")} 不適用</span></div></div>
  </div>
  <div class="grid">

        <tr><td>原始資料執行前後 SHA-256</td><td>${R.sha_unchanged ? pill("PASS") : pill("FAIL")}</td></tr>

        <tr><td>來源 ↔ 目標對帳 ${D.recon.length} 組</td><td>${reconBad ? pill("FAIL") : pill("PASS")}</td></tr>
        <tr><td>輸出檔明文個資掃描</td><td>${pill(pii.result)}</td></tr>

}

/* ---------- 2 品質比較 ---------- */
function qualityRows() {

    ["ORDER", "訂單筆數", B.cg.orders, B.cf.orders, A.orders, "全數載入，隔離 " + fmt(A.rejected_orders) + " 筆", "ETL-DQ-025"],

    ["ORDER", "校區代碼", B.cg.campus_codes + "（C01～C06）", B.cf.campus_codes + "（CFC01～07）", A.campus_codes + "（U01～U11）", "查對照表；C02 與 CFC02 不是同一校，不能用尾碼推算", "ETL-DQ-022"],

    ["ORDER", "用「商品－折扣＋運費」驗算實付對不上", B.cg.cross_formula, B.cf.cross_formula, A.formula_bad, "CG 為部分退款、CF 另有包裝費與小費；整併後分平台公式驗算", "ETL-DQ-019"],
    ["ORDER", "取消／全額退款單仍記小費或包裝費", null, B.cf.cancel_with_fee, A.cancel_fee_recognized, "保留原值，另建認列欄位（取消單記 0）", "ETL-DQ-018"],

    ["CUSTOMER", "會員制度", B.cg.member_values + " 級（等級制）", B.cf.member_values + " 種（訂閱制）", "原值＋制度別", "不互相換算，加 membership_scheme 區分", "ETL-DQ-020"],
    ["CUSTOMER", "共用電話（兩人同號）", B.cg.shared_phone, B.cf.shared_phone, "不當作比對鍵", "只用電話會多配出 5 筆假重疊", "ETL-DQ-012"],
    ["CUSTOMER", "明文個資欄位", B.cg.pii_cols, B.cf.pii_cols, 0, "輸出遮罩、比對鍵存 SHA-256、生日改出生年", "ETL-DQ-034"],
    ["CUSTOMER", "待人工覆核的低信心候選", "—", "—", A.er_review, "只中電話或姓名＋生日，不自動合併", "ETL-DQ-021"],
    ["COMPLAINT", "客訴筆數", B.cp.rows, null, A.complaints, "隔離 " + fmt(A.rejected_complaints) + " 筆（參照 2026-10 訂單，尚未提供）", "ETL-DQ-014"],
    ["COMPLAINT", "欄位數", B.cp.cols + " 欄", null, A.complaint_cols + " 欄", "加上全域鍵與血緣欄位；摘要自由文字不輸出", "ETL-DQ-017"],

function pQuality() {
  const DN = { ORDER: "訂單", CUSTOMER: "顧客", COMPLAINT: "客訴" };
  const rows = qualityRows().filter(r => domOK(r[0]) && (F.plat === "ALL" || (F.plat === "CG" ? r[2] != null : r[3] != null)));

  `<div class="card"><div class="card-head"><h3>${rows.length} 項比較</h3><span class="sub">資料域：${F.domain === "ALL" ? "全部" : DN[F.domain]}・平台：${F.plat === "ALL" ? "全部" : PL[F.plat]}</span></div>
   <div class="scroll"><table><thead><tr><th>資料域</th><th>項目</th>${showCG ? `<th class="n">CampusGo 整併前</th>` : ""}${showCF ? `<th class="n">CallFood 整併前</th>` : ""}<th class="n">整併後</th><th>處理方式</th><th>規則</th></tr></thead><tbody>
   ${rows.map(r => `<tr><td><span class="tag">${DN[r[0]]}</span></td><td>${esc(r[1])}</td>${showCG ? cell(r[2]) : ""}${showCF ? cell(r[3]) : ""}<td class="n better">${typeof r[4] === "number" ? fmt(r[4]) : esc(r[4])}</td><td class="note">${esc(r[5])}</td><td class="mono" style="font-size:.76rem">${r[6].slice(-3)}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">目前篩選條件下沒有比較項目</td></tr>`}
   </tbody></table></div></div>`;

/* ---------- 3 ETL 成效 ---------- */
function pEtl() {
  const sum = f => D.recon.reduce((a, r) => a + r[f], 0);
  const byQ = {}; D.recon.forEach(r => { const k = r.source_platform + "|" + r.quarter; const a = byQ[k] || (byQ[k] = { p: r.source_platform, q: r.quarter, so: 0, to: 0, rj: 0, sg: 0, tg: 0, do: 0, dg: 0, dp: 0 }); a.so += r.src_orders; a.to += r.tgt_orders; a.rj += r.rejected_orders || 0; a.sg += r.src_gmv; a.tg += r.tgt_gmv; a.do += r.diff_orders; a.dg += r.diff_gmv; a.dp += r.diff_paid; });
  const z = v => `<td class="n ${v === 0 ? "zero" : "FAIL"}">${fmt(v)}</td>`;
  const secs = (new Date(R.etl_end.replace(" ", "T")) - new Date(R.etl_start.replace(" ", "T"))) / 1000;
  return head(3, "ETL 成效", "每一筆來源資料都要有去處：載入、隔離或加旗標，不刪除。對帳以平台 × 季度 × 狀態比對，容忍度 0。") +
  `<div class="grid3">
    <div class="card kpi"><div class="label">執行時間</div><div class="value">${Math.round(secs)} 秒</div><div class="split"><span>${esc(R.etl_start.slice(11))} ～ ${esc(R.etl_end.slice(11))}</span></div></div>
    <div class="card kpi"><div class="label">對帳組數</div><div class="value">${D.recon.length} 組</div><div class="split"><span>差異不為 0：${D.recon.filter(r => r.diff_orders || r.diff_gmv || r.diff_paid).length} 組</span></div></div>
    <div class="card kpi"><div class="label">冪等雜湊</div><div class="value" style="font-size:1rem">${esc(R.idem[0].slice(0, 12))}…</div><div class="split"><span>第二次 ${esc(R.idem[1].slice(0, 12))}…　${R.idem[0] === R.idem[1] ? "相同" : "不同"}</span></div></div>
  </div>
  <div class="card"><h3>資料去向</h3><div class="scroll"><table><thead><tr><th>資料</th><th class="n">來源</th><th class="n">載入</th><th class="n">隔離</th><th class="n">載入但加旗標／警示</th><th>說明</th></tr></thead><tbody>
    <tr><td>訂單</td><td class="n">${fmt(B.cg.orders + B.cf.orders)}</td><td class="n">${fmt(A.orders)}</td><td class="n">${fmt(A.rejected_orders)}</td><td class="n">${fmt(A.before_reg + A.warn_orders)}</td><td class="note">訂單日早於註冊日 ${fmt(A.before_reg)}、退款單類型 NONE ${fmt(A.warn_orders)}</td></tr>
    <tr><td>顧客</td><td class="n">${fmt(A.xref)}</td><td class="n">${fmt(A.customers)} 人</td><td class="n">0</td><td class="n">${fmt(A.er_review)}</td><td class="note">合併重疊 ${fmt(A.overlap)} 人；${fmt(A.er_review)} 組候選待人工覆核</td></tr>
    <tr><td>客訴</td><td class="n">${fmt(B.cp.rows)}</td><td class="n">${fmt(A.complaints)}</td><td class="n">${fmt(A.rejected_complaints)}</td><td class="n">${fmt(D.complaint_issues.reduce((a, i) => a + i.n - i.quarantined, 0))}</td><td class="note">退款與結案狀態矛盾者照常載入並加旗標</td></tr>
  </tbody></table></div></div>
  <div class="card"><div class="card-head"><h3>來源 ↔ 目標對帳（平台 × 季度）</h3><span class="sub">筆數差異 = 來源 − 目標 − 隔離</span></div><div class="scroll"><table><thead><tr><th>季度</th><th>平台</th><th class="n">來源筆數</th><th class="n">目標筆數</th><th class="n">隔離</th><th class="n">筆數差異</th><th class="n">來源 GMV</th><th class="n">目標 GMV</th><th class="n">GMV 差異</th><th class="n">實付差異</th></tr></thead><tbody>
    ${Object.values(byQ).sort((a, b) => a.q.localeCompare(b.q) || a.p.localeCompare(b.p)).map(a => `<tr><td class="mono">${a.q}</td><td><i class="dot ${a.p === "CAMPUSGO" ? "cg" : "cf"}"></i>${PL[a.p]}</td><td class="n">${fmt(a.so)}</td><td class="n">${fmt(a.to)}</td><td class="n">${fmt(a.rj)}</td>${z(a.do)}<td class="n">${fmt(a.sg)}</td><td class="n">${fmt(a.tg)}</td>${z(a.dg)}${z(a.dp)}</tr>`).join("")}
    <tr><td colspan="2"><b>合計</b></td><td class="n"><b>${fmt(sum("src_orders"))}</b></td><td class="n"><b>${fmt(sum("tgt_orders"))}</b></td><td class="n">${fmt(sum("rejected_orders"))}</td>${z(sum("diff_orders"))}<td class="n"><b>${fmt(sum("src_gmv"))}</b></td><td class="n"><b>${fmt(sum("tgt_gmv"))}</b></td>${z(sum("diff_gmv"))}${z(sum("diff_paid"))}</tr>
  </tbody></table></div></div>`;
}

/* ---------- 4 規則驗證 ---------- */
const RV = { view: "grid", res: "ALL", cat: "ALL", risk: "ALL", type: "ALL", q: "", sel: null };
function ruleList() { const q = RV.q.trim().toLowerCase(); return V.filter(v => (RV.res === "ALL" || v.result === RV.res) && (RV.cat === "ALL" || v.category === RV.cat) && (RV.risk === "ALL" || v.risk === RV.risk) && (RV.type === "ALL" || v.check_type === RV.type) && (!q || (v.rule_id + v.name + v.detail).toLowerCase().includes(q))); }
function pRules() {
  const cats = [...new Set(V.map(v => v.category))], risks = [...new Set(V.map(v => v.risk))];
  const cnt = (r, t) => V.filter(v => v.result === r && (!t || v.check_type === t)).length;
  const MAP = [["PASS", "檢查通過", "否"], ["WARN", "有疑點但不算錯，需說明或覆核", "否"], ["FAIL", "違反規則，附處置說明", "是"], ["N/A", "本次範圍不適用（例如沒有增量載入）", "否"]];
  const total = V.length, max = Math.max(...MAP.map(m => cnt(m[0])));
  const list = ruleList();
  if (!RV.sel) RV.sel = (blockers[0] || V[0]).rule_id;
  const sel = V.find(v => v.rule_id === RV.sel);
  const opt = (arr, cur, all) => `<option value="ALL">${all}</option>` + arr.map(a => `<option value="${esc(a)}"${a === cur ? " selected" : ""}>${esc(a)}</option>`).join("");
  return head(4, "規則驗證結果（Rule ID）", `規則檔 ETL-DQ-001～040 共 ${total} 條全部有結果，規則本身執行錯誤 ${V.filter(v => +v.count < 0).length} 條。其中 ${cnt("PASS", "MANUAL") + cnt("WARN", "MANUAL") + cnt("FAIL", "MANUAL") + cnt("N/A", "MANUAL")} 條是人工確認，說明前標有【人工確認】。下表說明本報告的四種結果與發布閘門的關係。`) +
  `<div class="grid">
    <div class="card"><h3>狀態對應：通過／警示／未通過／不適用</h3><p class="sub">依 RULE.md 第 7 條（V1.4.0）：只要有一條未通過就不發布；警示與不適用不擋發布。</p>
      <div class="scroll"><table><thead><tr><th>本報告狀態</th><th>意義</th><th>擋發布</th><th class="n">自動</th><th class="n">人工</th><th class="n">規則數</th></tr></thead><tbody>
      ${MAP.map(m => `<tr><td>${pill(m[0])}</td><td>${m[1]}</td><td>${m[2]}</td><td class="n">${cnt(m[0], "AUTO")}</td><td class="n">${cnt(m[0], "MANUAL")}</td><td class="n"><b>${cnt(m[0])}</b></td></tr>`).join("")}
      <tr><td colspan="3"><b>合計</b></td><td class="n">${V.filter(v => v.check_type === "AUTO").length}</td><td class="n">${V.filter(v => v.check_type === "MANUAL").length}</td><td class="n"><b>${total}</b></td></tr>
      </tbody></table></div>
      <p class="note">ETL-DQ-032「下游資料契約與發布閘門」是閘門本身：其他規則有未通過時，它也記為未通過。</p></div>
    <div class="card"><div class="card-head"><h3>${total} 條規則的結果</h3><div class="toolbar"><button class="btn" id="rView">${RV.view === "grid" ? "表格檢視" : "格狀檢視"}</button><button class="btn" id="rCsv">匯出 CSV</button><button class="btn" id="rCopy">複製 CSV</button><span class="toast" id="rToast" aria-live="polite"></span></div></div>
      <div class="bars">${MAP.map(m => `<div class="bar"><span class="name">${pill(m[0])}</span><div class="track"><div class="fill" style="width:${cnt(m[0]) / max * 100}%;background:${{ PASS: "var(--good)", WARN: "var(--warn)", FAIL: "var(--bad)", "N/A": "var(--na)" }[m[0]]}"></div></div><span class="v">${cnt(m[0])}</span></div>`).join("")}</div>
      <p class="note">${total} / ${total} 條規則都有結果；未通過 ${cnt("FAIL")} 條（${fails.map(f => f.rule_id.slice(-3)).join("、")}），警示 ${cnt("WARN")} 條（${V.filter(v => v.result === "WARN").map(f => f.rule_id.slice(-3)).join("、")}）。</p></div>
  </div>
  <div class="card">
    <div class="toolbar">
      <div class="seg" id="rRes" role="group" aria-label="依結果篩選">${["ALL", "FAIL", "WARN", "PASS", "N/A"].map(r => `<button type="button" data-v="${r}" aria-pressed="${RV.res === r}">${r === "ALL" ? "全部" : RES[r]}</button>`).join("")}</div>
      <select id="rCat" aria-label="分類">${opt(cats, RV.cat, "全部分類")}</select>
      <select id="rRisk" aria-label="風險">${opt(risks, RV.risk, "全部風險")}</select>
      <select id="rType" aria-label="檢查方式"><option value="ALL">自動＋人工</option><option value="AUTO"${RV.type === "AUTO" ? " selected" : ""}>自動檢查</option><option value="MANUAL"${RV.type === "MANUAL" ? " selected" : ""}>人工確認</option></select>
      <input type="search" id="rQ" placeholder="搜尋規則、說明" value="${esc(RV.q)}" aria-label="搜尋規則">

    ["客訴整併", `連結訂單；參照不到隔離、矛盾加旗標`],
    ["Validation", `40 條規則、對帳、冪等（同一快照轉換兩次）`],
    ["Mask & Publish", `遮罩、PII 掃描、發布閘門；CLOSED 時輸出到 candidate/`],
    ["Dashboard", `build_dashboard.py 讀遮罩後資料與原始檔彙總統計，產生本頁`],
  ];
  return head(8, "方法與追溯", "每一筆輸出都能追回來源檔與規則版本；所有規則與目標的修改都記錄在 command_note.md，修改前備份到 BACK_UP/。") +
  `<div class="grid">
    <div class="card"><h3>處理流程</h3><ol class="flow">${steps.map(s => `<li><div><b>${s[0]}</b><div class="note">${esc(s[1])}</div></div></li>`).join("")}</ol></div>
    <div class="card"><h3>血緣欄位</h3><table><tbody>
      <tr><td class="mono">source_platform</td><td class="note">CAMPUSGO／CALLFOOD</td></tr>
      <tr><td class="mono">source_file</td><td class="note">原始檔名</td></tr>
      <tr><td class="mono">source_*_id</td><td class="note">來源編號，與全域鍵並存</td></tr>
      <tr><td class="mono">etl_run_id</td><td class="note">${esc(R.run_id)}</td></tr>
      <tr><td class="mono">rule_version</td><td class="note">${esc(R.rule_version)}</td></tr>
      </tbody></table>
      <h3 style="margin-top:6px">變更紀錄（command_note.md）</h3>
      <table><tbody>${D.changes.slice().reverse().map(c => `<tr><td class="mono">${c.version}</td><td class="note">${esc(c.time)}</td></tr>`).join("")}</tbody></table></div>
  </div>
  <div class="card"><div class="card-head"><h3>原始檔與雜湊（唯讀）</h3><span class="sub">執行前後 SHA-256 ${R.sha_unchanged ? "一致" : "不一致"}</span></div><div class="scroll"><table><thead><tr><th>檔案</th><th>BOM</th><th class="n">列數</th><th>批次</th><th>SHA-256（前 16 碼）</th></tr></thead><tbody>
    ${D.files.map(f => `<tr><td class="mono" style="font-size:.78rem">${esc(f.file)}</td><td>${f.bom ? "有" : "無"}</td><td class="n">${fmt(f.rows)}</td><td class="mono" style="font-size:.74rem">${esc(f.batch)}</td><td class="mono" style="font-size:.74rem">${esc((R.sha[f.file] || "").slice(0, 16))}</td></tr>`).join("")}
  </tbody></table></div></div>`;
}

/* ---------- 9 驗收測試 ---------- */
function pAcceptance() {
  const r = id => V.find(v => v.rule_id === id).result;
  const reconBad = D.recon.filter(x => x.diff_orders || x.diff_gmv || x.diff_paid).length;
  const T = [
    ["AT-01", "40 條規則都有結果", "40 條", `${V.length} 條`, V.length === 40],
    ["AT-02", "沒有任何規則未通過（或已核准例外）", "未通過 0 條", `未通過 ${blockers.length} 條（另 032 閘門）`, blockers.length === 0],
    ["AT-03", "訂單：來源 = 載入 + 隔離", fmt(B.cg.orders + B.cf.orders), `${fmt(A.orders)} + ${fmt(A.rejected_orders)}`, B.cg.orders + B.cf.orders === A.orders + A.rejected_orders],
    ["AT-04", "顧客去重後人數與重疊人數", "31,620 人／4,980 人", `${fmt(A.customers)} 人／${fmt(A.overlap)} 人`, A.customers === 31620 && A.overlap === 4980],
    ["AT-05", "各平台各季 GMV、實付差異為 0", "0 組有差異", `${reconBad} 組有差異`, reconBad === 0],
    ["AT-06", "輸出檔掃描不到明文個資", "ETL-DQ-034 通過", RES[r("ETL-DQ-034")], r("ETL-DQ-034") === "PASS"],
    ["AT-07", "sample_data 執行前後 SHA-256 不變", "一致", R.sha_unchanged ? "一致" : "不一致", R.sha_unchanged],
    ["AT-08", "同一快照重跑結果一致", "兩次雜湊相同", R.idem[0] === R.idem[1] ? "相同" : "不同", R.idem[0] === R.idem[1]],
    ["AT-09", "客訴：來源 = 載入 + 隔離", fmt(B.cp.rows), `${fmt(A.complaints)} + ${fmt(A.rejected_complaints)}`, B.cp.rows === A.complaints + A.rejected_complaints],
    ["AT-10", "閘門未通過時不發布，資料只在候選資料集", "CLOSED → candidate/", open ? "OPEN → merged_output/" : `CLOSED → ${R.source_dir}/`, open || R.source_dir.endsWith("candidate")],
  ];
  const ok = T.filter(t => t[4]).length;
  return head(9, "驗收測試", "依《DuckDB_ETL_驗證引擎_需求規格》第 6 節驗收標準，加上冪等、客訴與閘門行為三項。每項由本次執行結果自動判定。") +
  `<div class="grid3"><div class="card kpi"><div class="label">驗收結果</div><div class="value">${ok} / ${T.length} 通過</div><div class="split">${T.length - ok ? `<span class="pill FAIL">${T.length - ok} 項未通過</span>` : `<span class="pill PASS">全部通過</span>`}</div></div></div>
  <div class="card"><div class="scroll"><table><thead><tr><th>編號</th><th>驗收條件</th><th>預期</th><th>實際</th><th>結果</th></tr></thead><tbody>
    ${T.map(t => `<tr><td class="mono">${t[0]}</td><td>${t[1]}</td><td class="note">${t[2]}</td><td class="mono" style="font-size:.8rem">${esc(t[3])}</td><td>${pill(t[4] ? "PASS" : "FAIL")}</td></tr>`).join("")}
  </tbody></table></div>
  ${blockers.length ? `<p class="note">AT-02 未通過是因為 ${blockers.map(b => b.rule_id).join("、")} 尚待外部資料或確認，見 §7。這是資料本身的狀況，不以修改規則換取通過。</p>` : ""}</div>`;
}

/* ---------- 繪製 ---------- */
const RENDER = { overview: pOverview, quality: pQuality, etl: pEtl, rules: pRules, issues: pIssues, business: pBusiness, risk: pRisk, method: pMethod, acceptance: pAcceptance };
function render() {
  syncFilters();
  const box = $("p-" + page); box.innerHTML = RENDER[page]();
  box.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { go(b.dataset.go, true); window.scrollTo(0, 0); });
  if (page === "rules") bindRules();
  if (page === "issues") drawIssues();
  if (page === "business") drawBusiness();
}
bindFilters();
$("foot").innerHTML = `<div>由 <span class="mono">etl/build_dashboard.py</span> 產生：整併後數字來自 <span class="mono">${esc(R.source_dir)}/</span> 遮罩後資料，整併前數字由 <span class="mono">sample_data/</span> 唯讀彙總。只含彙總數字，不含任何一筆個資。</div><div>儀表板 ${esc(D.version)}・執行批次 ${esc(R.run_id)}・規則版本 ${esc(R.rule_version)}</div>`;
go(location.hash.replace("#s-", "") || "overview", false);
</script>

</body>
